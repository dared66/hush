name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build, sanitize, and verify installation scripts
        run: zsh scripts/check.sh
      - name: Package and verify installer (does not install)
        run: zsh scripts/package-installer.sh
      - name: Package source
        run: zsh scripts/package-source.sh
      - name: Verify source archive builds independently
        shell: bash
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          archive="$PWD/dist/hush-$version-source.tar.gz"
          source_check=$(mktemp -d)
          trap 'rm -rf "$source_check"' EXIT
          tar -xzf "$archive" -C "$source_check"
          cd "$source_check"
          zsh scripts/check.sh
